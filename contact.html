<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saparya | Devotion Delivered</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --maroon: #7b1e1a;     /* Deep Kumkum Red */
            --gold: #c5a059;       /* Antique Gold */
            --cream: #faf5eb;      /* Sandalwood Cream */
            --dark-wood: #3e2723;  /* Espresso text */
            --white: #ffffff;
        }

        body { 
            font-family: 'Lato', sans-serif; 
            margin: 0; 
            background-color: var(--cream); 
            color: var(--dark-wood); 
            line-height: 1.8; 
        }

        h1, h2, h3 { 
            font-family: 'Cinzel', serif; 
            color: var(--maroon); 
            font-weight: 700;
        }

        /* --- Elegant Top Navigation --- */
        nav { 
            background: var(--maroon); 
            padding: 15px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 4px solid var(--gold);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { 
            font-family: 'Cinzel', serif; 
            font-size: 2.2rem; 
            color: var(--gold); 
            text-decoration: none;
            letter-spacing: 2px;
        }

        nav .nav-links a { 
            color: var(--cream); 
            text-decoration: none; 
            margin-left: 30px; 
            font-size: 0.95rem; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            transition: 0.3s;
        }

        nav .nav-links a:hover { color: var(--gold); }

        /* --- Hero Section --- */
        .hero { 
            text-align: center; 
            padding: 100px 20px; 
            background: radial-gradient(circle, var(--white) 0%, var(--cream) 100%);
            border-bottom: 2px dashed var(--gold);
        }

        .hero h1 { 
            font-size: 3.5rem; 
            margin-bottom: 10px; 
            letter-spacing: 1px;
        }

        .hero p { 
            font-size: 1.2rem; 
            max-width: 605px; 
            margin: 0 auto 30px auto; 
            color: var(--dark-wood);
        }

        .divider {
            height: 3px;
            width: 80px;
            background-color: var(--gold);
            margin: 20px auto;
        }

        /* --- Heritage Buttons --- */
        .btn-gold {
            background: var(--gold);
            color: var(--maroon);
            padding: 14px 35px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            border: 2px solid var(--gold);
            transition: 0.3s;
            display: inline-block;
            letter-spacing: 1px;
        }

        .btn-gold:hover {
            background: transparent;
            color: var(--maroon);
        }

        /* --- Framed Services Section --- */
        .container { max-width: 1100px; margin: 80px auto; padding: 0 20px; }
        
        .services-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 40px; 
        }

        .service-box { 
            background: var(--white);
            padding: 50px 30px;
            text-align: center;
            border: 1px solid #ebd9c8;
            outline: 2px solid var(--gold);
            outline-offset: -10px;
            transition: 0.4s ease;
        }

        .service-box:hover {
            background: var(--maroon);
            outline-color: var(--cream);
            color: var(--cream);
        }

        .service-box:hover h3, .service-box:hover p { color: var(--cream); }

        .service-box h3 { font-size: 1.6rem; margin-bottom: 15px; transition: 0.3s; }
        .service-box p { font-size: 1rem; transition: 0.3s; }
        .icon { font-size: 3rem; margin-bottom: 15px; }

        /* --- Royal Footer --- */
        footer { 
            background: var(--dark-wood); 
            color: var(--cream); 
            padding: 60px 20px 30px; 
            text-align: center;
            border-top: 5px solid var(--maroon);
        }

        footer .logo { font-size: 2rem; margin-bottom: 20px; display: block; }
        
        .footer-links { margin: 30px 0; }
        .footer-links a { 
            color: var(--gold); 
            text-decoration: none; 
            margin: 0 15px; 
            font-size: 0.9rem; 
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            nav { flex-direction: column; }
            nav .nav-links { margin-top: 20px; }
            nav .nav-links a { margin: 0 10px; }
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Saparya</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">Our Roots</a>
            <a href="contact.html">Contact Us</a>
            <a href="data-deletion-request.html">Privacy</a>
        </div>
    </nav>
